<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>スライド</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      body { overflow: hidden; }
      body.actual { overflow: auto; }
      img { display: block; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
      body.actual img { width: auto; height: auto; max-width: none; margin: auto; cursor: zoom-out; }
      .bar { position: fixed; top: 8px; right: 8px; display: flex; gap: 6px; }
      button {
        font: 13px/1.5 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: #fff; background: rgba(32, 33, 36, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 6px;
        padding: 4px 10px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img id="image" alt="スライド" />
    <div class="bar">
      <button id="toggle">原寸で表示</button>
      <button id="close" title="Esc">✕ 閉じる</button>
    </div>
    <script src="viewer.js"></script>
  </body>
</html>
