<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Slide Rewind Harness</title>
    <style>
      body { margin: 0; font: 13px system-ui, sans-serif; display: grid; grid-template-columns: 1fr 380px; height: 100vh; }
      #stage { position: relative; background: #111; display: grid; place-items: center; }
      #share { width: 90%; }
      #camera { position: absolute; right: 12px; bottom: 12px; width: 200px; }
      #log { position: absolute; left: 8px; top: 8px; color: #0f0; font: 11px monospace; white-space: pre; max-height: 40vh; overflow: auto; }
      iframe { width: 100%; height: 100%; border: 0; border-left: 1px solid #444; }
    </style>
  </head>
  <body>
    <div id="stage">
      <video id="share" muted autoplay playsinline></video>
      <video id="camera" muted autoplay playsinline></video>
      <div id="log"></div>
    </div>
    <iframe id="panel"></iframe>
    <script src="/harness/harness.js"></script>
  </body>
</html>
